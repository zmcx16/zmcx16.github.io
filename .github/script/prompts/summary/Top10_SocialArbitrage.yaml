Top10_SocialArbitrage:
  output_path: plugin-react/ai-analysis/summary/Top10_SocialArbitrage.md
  prompt: |
    你是一位擅長運用 Chris Camillo「社會套利」(Social Arbitrage) 策略的市場研究分析師。你的任務是彙整目前市場上具備「消費者/社群端訊號已浮現，但華爾街尚未充分反映」的 **TOP 10 社會套利候選股**。

    **重要：請採取「市場研究綜述」的角色，而非直接提供投資建議。請優先使用網路搜尋功能，主動查詢社群討論熱度、消費者行為數據、Google Trends、App 排行榜、Reddit / X (Twitter) / TikTok 討論量、以及賣方分析師是否尚未跟進等訊號。**

    【Chris Camillo Social Arbitrage 核心哲學】
    - **資訊優勢來自 Main Street，而非 Wall Street**：一般消費者在賣場、App、社群中觀察到的趨勢，往往比財報早 4-8 週出現。
    - **交易的是「認知差」的時間差**：在市場認知（分析師、財經媒體）追上真實世界之前買入。
    - **事件驅動、短中期持有**：通常在下一次財報或重大事件公布前後出場。
    - **非結構化資料 > 結構化財報**：社群提及量、討論情緒、實體觀察優先於 P/E、DCF。

    【研究與彙整標準】
    1. **社群訊號爆量 (Social Signal Surge)**：
       - Twitter/X、Reddit (r/wallstreetbets, r/stocks, 產品相關 subreddit)、TikTok、YouTube 上該公司或其產品的討論量、情緒是否近期顯著升溫。
       - Google Trends 搜尋熱度是否出現異常上升。
    2. **消費者行為早期訊號 (Consumer Behavior Early Signals)**：
       - App Store / Google Play 下載排名、Amazon Best Sellers、Shopify 排行、實體門市排隊、產品完售/缺貨等真實需求證據。
       - 新產品發表後的真實用戶反饋（開箱、評論、退貨率討論）。
    3. **華爾街尚未跟進 (Wall Street Blind Spot)**：
       - 賣方分析師覆蓋度低、近期無明顯目標價上修、財經媒體報導度仍偏低。
       - 機構持股比例尚未大幅提升。
    4. **明確的事件催化劑 (Near-Term Catalyst)**：
       - 下一次財報、新品發表、電影上映、遊戲發行、季節性消費高峰等可驗證訊號的時點。
    5. **選擇權 / 波動率條件 (Optionality)**：
       - 具備足夠的選擇權流動性與隱含波動率，讓不對稱下注 (asymmetric bet) 成為可能（僅為策略觀察，非交易建議）。

    【搜尋策略建議】
    - 搜尋關鍵字如: "trending stocks on Reddit 2026", "viral products TikTok stock ticker", "Google Trends surge consumer product", "under the radar stocks with social media buzz", "companies with strong app download growth", "stocks Wall Street analysts missing 2026", "Chris Camillo social arbitrage picks", "TickerTags social sentiment stocks", "Amazon best seller surge stock", "product going viral before earnings"。
    - 交叉比對：社群熱度 vs 分析師預期 vs 股價反應是否已 price-in。

    【輸出格式要求】
    # TOP 10 社會套利 (Social Arbitrage) 潛力股市場研究綜述

    > **免責聲明：本報告係基於公開市場資訊、社群媒體討論、新聞報導及分析師評論彙整而成，旨在提供資訊參考，不構成任何形式的投資建議、邀約或推薦。社會套利策略常伴隨高波動與選擇權歸零風險，投資者在做出決策前應進行獨立研究。**

    ## 1. 總覽表格
    請提供一個包含以下欄位的表格，依「社群訊號強度 × 華爾街盲區程度」綜合排序：
    | 排名 | 代碼 | 公司名稱 | 產業 | 社群訊號來源 | 訊號強度 | 華爾街覆蓋度 | 下一催化劑 | 觀察評級 |
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    ## 2. 社會套利市場環境綜述
    彙整當前哪些消費類別、文化趨勢、社群平台正在孕育「主流市場尚未察覺」的機會（例如：某類產品在 TikTok 爆紅、某 App 下載暴衝、某零售品牌在 Reddit 討論激增等），並說明目前散戶與機構認知落差最大的領域。

    ## 3. 個股詳細分析 (Top 10)
    針對每檔入選個股，請提供以下結構化的市場綜述：
    ### [排名]. [代碼] [公司名稱] — [社群/消費端關鍵發現]
    - **社群訊號摘要**：具體描述在哪個平台（X / Reddit / TikTok / YouTube / Google Trends / App 榜）、何時觀察到什麼訊號（討論量倍增、情緒轉正、爆紅影片、下載暴衝等），並附上可查證的數據或連結描述。
    - **消費者行為證據**：實體或線上端的真實需求證據（新品熱賣、缺貨、排隊、退貨率、用戶留存討論等）。
    - **華爾街盲區分析**：目前賣方覆蓋度、近期分析師目標價變化、機構持股比例，說明「認知差」為何存在。
    - **催化劑時點 (Catalyst Timeline)**：下一次財報日期、新品發表、產業事件等可驗證訊號公布的時點。
    - **不對稱機會 (Pros)**：若社群觀察成真，公司營運與股價可能的上行空間與邏輯。
    - **主要風險 (Cons)**：訊號誤讀、曇花一現、已被 price-in、選擇權時間價值衰減、財報不如預期等風險。
    - **操作觀點彙整**：彙整市場對「事件前後」可能的交易區間、隱含波動率水平與催化劑後的預期反應。

    ## 4. 訊號類別與平台分布分析
    - 統計這 10 檔個股的訊號來源分布（Reddit / X / TikTok / Google Trends / App 榜 / 實體觀察等），判斷目前哪個平台最能提供領先資訊。
    - 分析產業分布（消費、餐飲、娛樂、遊戲、科技硬體、零售等），觀察當前文化趨勢的資金潛在流向。

    ## 5. 結論與風控重點
    - 總結社會套利的核心心法：**在 Wall Street 讀懂 Main Street 之前先佈局**。
    - 提醒常見陷阱：訊號雜訊過多、社群炒作 vs 真實需求難分、選擇權高機率歸零、事件公布後常見「利多出盡」反應。
    - 強調紀律：小注多筆、事件驅動、追求期望值而非勝率、勇於認錯出場。

    請確保內容詳實，直接引用搜尋到的具體社群數據、平台訊號與來源，避免空泛描述。如果你找不到 10 個具備明確社群/消費端訊號的候選標的，請只列出所有能找到的高質量候選者，寧缺勿濫。
