name: GetEarningsData

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 4 * * *'

jobs:
  build:
    runs-on: macos-13
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Check out repo
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - uses: actions/cache@v4
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Python dependencies
      run: |
        python -m pip install -r ./.github/script/requirements.txt
    - name: get earnings data
      run: |-
        python ./.github/script/build_similar-earning-data.py
    - name: Commit and push if data changed
      run: |-
        git config --global user.email "zmcx16-bot@zmcx16.moe"
        git config --global user.name "zmcx16-bot"
        git config --global pull.ff only
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60
        # 6 min stall -> kill and retry, avoid hanging on GitHub sideband stalls
        for i in 1 2 3 4 5; do timeout 360 git pull && break || (echo "git pull failed/stalled, retry $i" && sleep $((i * 10))); done
        git diff
        git diff --quiet || (git add *.json && git commit -m "Updated earnings data")
        for i in 1 2 3 4 5; do timeout 360 git pull --rebase origin master && break || (echo "git pull --rebase failed/stalled, retry $i" && sleep $((i * 10))); done
        for i in 1 2 3 4 5; do timeout 360 git push && break || (echo "git push failed/stalled, retry $i" && sleep $((i * 10))); done
